<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Background Properties</title>

    <style>

        body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        }

        .background-box {
        width: 1200px;
        height: 300px;

        border: 1px solid gray;

        padding: 30px;

        background-image: url("https://th.bing.com/th/id/R.1164da34ea0f7af61283ec2719e4c255?rik=PH6%2boOryBdYjVQ&pid=ImgRaw&r=0");

        background-size: cover;

        background-position: center;
        }

        h2 {
            font-weight: bold;
        }

        ul {
            margin-top: 20px;
        }

        li {
            margin-bottom: 15px;
            font-size: 17px;
        }

        .red-text {
            color: rgb(0, 0, 0);
        }

    </style>

</head>

<body>

    <div class="background-box">

        <h2>
            In these chapters, you will learn about the following CSS background properties:
        </h2>

        <ol>
            <li><span class="red-text">background-color</span></li>
            <li><span class="red-text">background-image</span></li>
            <li><span class="red-text">background-repeat</span></li>
            <li><span class="red-text">background-attachment</span></li>
            <li><span class="red-text">background-position</span></li>
            <li><span class="red-text">background</span> (shorthand property)</li>
        </ol>

    </div>

</body>
</html>
