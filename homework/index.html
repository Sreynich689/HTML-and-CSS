<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Practice Webpage</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header class="main-headerrr">
        <h1>Student Practice Webpage</h1>
        <p>HTML + CSS Practice (Forms + Table Advanced)</p>
    </header>

    <section class="card">
        <h2>Image Section</h2>

        <img
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop"
            alt="Nature Image"
            class="main-image"
        />
    </section>

    <section class="card">
        <h2>Advanced Tableee</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th rowspan="2">Name</th>
                        <th colspan="2">Scores</th>
                        <th rowspan="2">Grade</th>
                    </tr>
                    <tr>
                        <th>Math</th>
                        <th>CS</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Alice</td>
                        <td>90</td>
                        <td>95</td>
                        <td>A</td>
                    </tr>

                    <tr>
                        <td>Bob</td>
                        <td>80</td>
                        <td>85</td>
                        <td>B</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card form-card">
        <h2>Form 1: Basic Info</h2>

        <form>
            <div class="form-group">
                <label>Name <span>*</span></label>
                <input type="text" required />
            </div>

            <div class="form-group">
                <label>Email <span>*</span></label>
                <input type="email" required />
            </div>

            <div class="form-group">
                <label>Password <span>*</span></label>
                <input type="password" required />
            </div>

            <div class="form-group">
                <label>Upload File</label>
                <input type="file" />
            </div>

            <div class="button-group">
                <button type="submit">Submit</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>
        </form>
    </section>

    <section class="card form-card">
        <h2>Form 2: Survey Form</h2>

        <form>
            <div class="form-group">
                <label>Choose Course <span>*</span></label>

                <select required>
                    <option value="">-- Select --</option>
                    <option>HTML</option>
                    <option>CSS</option>
                    <option>JavaScript</option>
                </select>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="inline-group">
                    <label>
                        <input type="radio" name="gender" />
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" />
                        Female
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Skills</label>

                <div class="inline-group">
                    <label><input type="checkbox" /> HTML</label>
                    <label><input type="checkbox" /> CSS</label>
                    <label><input type="checkbox" /> JS</label>
                </div>
            </div>

            <div class="form-group">
                <label>Phone <span>*</span></label>
                <input type="tel" required />
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea rows="5"></textarea>
            </div>

            <button type="submit">Send</button>
        </form>
    </section>

</body>
</html>
